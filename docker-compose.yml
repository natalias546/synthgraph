services:
  neo4j:
    image: neo4j:5.26
    container_name: feder-neo4j
    ports:
      - "7474:7474"  # browser
      - "7687:7687"  # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
